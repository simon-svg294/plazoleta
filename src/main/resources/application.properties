spring.application.name=Plazoleta

#Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spirng.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Dialecto
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Security
jwt.secret=MiClaveSuperSecretaParaJWT123456789L
jwt.expiration=3600000

#Logs
logging.level.org.springframework.security=DEBUG

